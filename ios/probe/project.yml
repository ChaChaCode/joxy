# A throwaway probe: does a Packet Tunnel extension start when the app is signed with a free Apple ID (Sideloadly)?
name: JoxyProbe
options:
  bundleIdPrefix: com.joxy
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JoxyProbe:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JOXY test
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joxy.probe
    dependencies:
      - target: Tunnel
        embed: true
      - sdk: NetworkExtension.framework
  Tunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel]
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: JOXY test tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joxy.probe.tunnel
    dependencies:
      - sdk: NetworkExtension.framework
schemes:
  JoxyProbe:
    build:
      targets:
        JoxyProbe: all
